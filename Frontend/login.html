<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TechQuiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="logo">
      TechQuiz <br>
      <span>&lt;/&gt;</span>
    </div>

    <div class="toggle">
      <button onclick="mostrarCadastro()">Cadastro</button>
      <button onclick="mostrarLogin()">Login</button>
    </div>

    <div id="formCadastro">
      <h2>Cadastro</h2>

      <div class="input-group">
        <input type="text" id="nome" placeholder="Digite seu nome">
      </div>

      <div class="input-group">
        <input type="email" id="emailCadastro" placeholder="Digite seu e-mail">
      </div>

      <div class="input-group">
        <input type="password" id="senhaCadastro" placeholder="Digite sua senha">
      </div>

      <button class="btn" onclick="cadastrar()">Cadastrar</button>
    </div>

    <div id="formLogin" style="display: none;">
      <h2>Login</h2>

      <div class="input-group">
        <input type="email" id="emailLogin" placeholder="Digite seu e-mail">
      </div>

      <div class="input-group">
        <input type="password" id="senhaLogin" placeholder="Digite sua senha">
      </div>

      <button class="btn" onclick="login()">Entrar</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
